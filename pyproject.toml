[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speed-zone-witness"
version = "0.1.0"
description = "Read-only evidence for path-aware robot speed-zone limits."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
speed-zone-witness = "speed_zone_witness:main"

[tool.setuptools]
py-modules = ["speed_zone_witness"]
